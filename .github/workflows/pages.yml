name: Fetch trends and deploy to Pages

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "web/**"
      - "fetch_trends.py"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Change GEO to your country code (e.g. GB, AU, IN, JP) to show local trends.
  # Override via a GitHub Actions variable named GEO in repo Settings → Secrets and variables.
  GEO: ${{ vars.GEO || 'US' }}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch trends
        run: python3 fetch_trends.py
        env:
          GEO: ${{ env.GEO }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deploy
        uses: actions/deploy-pages@v4

      # GitHub disables scheduled workflows after 60 days without repo commits.
      # Re-enable via API when approaching that window (no empty commits needed).
      - name: Keep scheduled workflow alive
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          default_branch=$(gh api "repos/${repo}" --jq '.default_branch')
          last_commit_date=$(gh api "repos/${repo}/commits/${default_branch}" --jq '.commit.committer.date')
          days_since=$(( ( $(date -u +%s) - $(date -u -d "$last_commit_date" +%s) ) / 86400 ))
          echo "Days since last commit on ${default_branch}: ${days_since}"
          if [ "$days_since" -lt 45 ]; then
            echo "Repository is active; no keep-alive needed."
            exit 0
          fi
          echo "Repository inactive for ${days_since} days; re-enabling scheduled workflow."
          gh workflow enable pages.yml --repo "$repo"
