<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trends of the Day</title>

    <!-- OG / social preview -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://apoorvkulkarni.com/trending-screensaver/" />
    <meta property="og:title"       content="Trends of the Day" />
    <meta property="og:description" content="Today's Google Trends as fish drifting through a deep-ocean scene. Inspired by the macOS Word of the Day screensaver." />
    <!-- og:image: replace with a screenshot URL once you have one -->
    <!-- <meta property="og:image" content="https://apoorvkulkarni.com/trending-screensaver/preview.png" /> -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Trends of the Day" />
    <meta name="twitter:description" content="Today's Google Trends as fish drifting through a deep-ocean scene." />

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="caustics" aria-hidden="true"></div>

    <div class="word ghost-3" id="ghost3"></div>
    <div class="word ghost-1" id="ghost1"></div>
    <div class="word ghost-2" id="ghost2"></div>

    <div class="focus" id="focus">
      <a class="hero" id="hero" target="_blank" rel="noopener noreferrer"></a>
      <div class="card" id="card">
        <img class="thumb" id="thumb" alt="" />
        <div class="meta">
          <a class="headline" id="headline" target="_blank" rel="noopener noreferrer"></a>
          <p class="news-source" id="newsSource"></p>
          <p class="traffic" id="traffic"></p>
        </div>
      </div>
    </div>

    <footer class="source" id="source"></footer>
    <script src="app.js"></script>
  </body>
</html>
